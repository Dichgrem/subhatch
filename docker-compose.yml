services:
  subhatch:
    image: brantcoat/subhatch:latest
    ports:
      - "3000:3000"
    volumes:
      - subhatch-data:/data
    environment:
      - ADMIN_PASSWORD=your_strong_password
      - SUB_TOKEN=your_random_token
      - VLESS_NODES=vless://...#node1|vmess://...#node2
    restart: unless-stopped

volumes:
  subhatch-data:
